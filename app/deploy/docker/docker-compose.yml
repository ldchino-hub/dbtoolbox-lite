services:
  dbtoolbox-php:
    build:
      context: ../../..
      dockerfile: dbtoolbox-php-1.0.0/deploy/docker/Dockerfile
    image: dbtoolbox-php:1.0.0
    container_name: dbtoolbox-php
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - dbtoolbox-php-storage:/var/www/html/storage
    ports:
      - "${DBTOOLBOX_PHP_PORT:-8788}:80"
    networks:
      - dbtoolbox-net

volumes:
  dbtoolbox-php-storage:

networks:
  dbtoolbox-net:
    external: true
    name: dbtoolbox-net
